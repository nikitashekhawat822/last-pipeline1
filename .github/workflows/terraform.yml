name: Terraform CI/CD

on:
  push:
    branches:
      - feature

  workflow_dispatch:

jobs:
  terraform:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.Azure_CRED }}

      - name: Check Azure Account
        run: az account show

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply
        run: terraform apply -auto-approve

      - name: Check Resource Groups
        run: az group list --output table
      - name: Check New Resource Groups
        run: |
       az group show --name runner1 --output table
       az group show --name runner2 --output table